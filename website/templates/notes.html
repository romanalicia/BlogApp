{% extends "template.html" %} {% block title %} Notes {% endblock %} {% block
content %}
<h1 align="center">Notes</h1>
<ul class="list-group list-group-flush" id="notes">
  {% for notes in user.notes %}
  <div class="card border-dark">
    <div
      class="card-header bgcolor d-flex justify-content-between align-items-center"
    >
      <div class="card-text">{{ notes.data }}</div>
      <button type="button" class="close" onClick="deleteNotes({{ notes.id }})">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </div>
  <br />
  {% endfor %}
</ul>

<br />
<form method="POST">
  <textarea name="notes" id="notes" class="form-control"></textarea>
  <br />
  <div align="center">
    <button type="submit" class="btn btn-primary">Notes</button>
  </div>
</form>
<br />

{% endblock %}
